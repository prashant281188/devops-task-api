apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-api-postgres-pvc
  namespace: task-api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-postgres
  namespace: task-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: task-api-postgres
  template:
    metadata:
      labels:
        app: task-api-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: taskdb
            - name: POSTGRES_USER
              value: taskapp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-api-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: task-api-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: task-api-postgres
  namespace: task-api
spec:
  type: ClusterIP
  selector:
    app: task-api-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432