
name: Task API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgresql://taskapp:admin@localhost:5432/taskdb

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: docker build -t devops-task-api:${{ github.sha }} .
