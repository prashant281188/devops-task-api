
name: Task API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: taskdb
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: taskpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskapp -d taskdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PORT: 3000
      NODE_ENV: test
      DATABASE_URL: postgresql://taskapp:taskpass@127.0.0.1:5432/taskdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test
        env:
          PORT: 3000
          NODE_ENV: test
          DATABASE_URL: postgresql://taskapp:taskpass@localhost:5432/taskdb

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: docker build -t devops-task-api:${{ github.sha }} .
