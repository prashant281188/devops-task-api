name: Task API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: taskdb
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: taskpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskapp -d taskdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PORT: 3000
      NODE_ENV: test
      DATABASE_URL: postgresql://taskapp:taskpass@127.0.0.1:5432/taskdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U taskapp -d taskdb; then
              exit 0
            fi
            echo "Waiting for PostgreSQL ($attempt/30)..."
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Initialize database schema
        run: |
          PGPASSWORD=taskpass psql \
            -h 127.0.0.1 \
            -U taskapp \
            -d taskdb \
            -v ON_ERROR_STOP=1 \
            -f db/init/001-create-tasks.sql

      - name: Run automated tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: docker build -t devops-task-api:${{ github.sha }} .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and Publich Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{github.event_name=='push'}}
          tags: |
            ghcr.io/${{github.repository}}:latest
            ghcr.io/${{github.repository}}:sha-${{github.sha}}
